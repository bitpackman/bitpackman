name: build city of commits

on:
  # 毎日0:40(UTC)に再生成(metricsの完了を待ってから走らせる)
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/city.yml"
      - "scripts/generate-city.mjs"

permissions:
  contents: write

# mainへ書き込むワークフロー同士を直列化してpush競合を防ぐ
concurrency:
  group: profile-main-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate isometric city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-city.mjs "${{ github.repository_owner }}"
      - name: Commit & Push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A city/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: rebuild city of commits"
          # 他ワークフローが先にmainへpushしていても取り込んでから送る
          git pull --rebase --autostash
          git push
